name: Environment Fabric
on:
  push:
    branches: [main, codex/environment-fabric]
  pull_request:
permissions:
  contents: read
jobs:
  deterministic:
    name: Factory contracts and regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ls --all
      - run: npm audit --audit-level=low
      # The generated preview deliberately installs offline; provision its own locked cache first.
      - run: npm ci --prefix templates/feedback-hub --ignore-scripts --no-audit --no-fund
      - run: npm audit --prefix templates/feedback-hub --audit-level=low
      # Existing local verification deliberately uses --pull=never at execution.
      # Provision its current image before tests; this is not the cloud runtime.
      - run: docker pull node:22-bookworm
      # EvidenceProvider static-preview tests require the locked Playwright browser.
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm test
      - name: All connected PostgreSQL integration gates
        run: CAPABILITY_TEST_POSTGRES_BIN="$(pg_config --bindir)" node scripts/qualify-connected-tests.mjs
      - name: Install the qualified CLI without changing application dependencies
        run: npm install --prefix "$RUNNER_TEMP/factory-qualified-cli" --ignore-scripts --no-audit --no-fund @openai/codex@0.157.0
      # Official Ubuntu24 prerequisite for sandboxed CLI tools. Keep the kernel
      # restriction enabled; grant namespace setup only to the distro bwrap helper.
      - name: Install the Linux CLI sandbox prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap apparmor-profiles apparmor-utils
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          /usr/bin/bwrap --version
      - name: Prove CLI sandbox boundaries before integration tests
        run: |
          export PATH="$RUNNER_TEMP/factory-qualified-cli/node_modules/.bin:$PATH"
          node scripts/qualify-cli-sandbox.mjs
      - name: All installed CLI integration gates
        env:
          FACTORY_INSTALLED_CLI: '1'
          FACTORY_TEST_CODEX_CLI: '1'
        run: |
          export PATH="$RUNNER_TEMP/factory-qualified-cli/node_modules/.bin:$PATH"
          # Fixtures use RUNNER_TEMP for retained CLI homes, separately from the
          # CLI scratch TMPDIR. Codex rejects homes inside its own scratch root.
          node --test --test-concurrency=1 apps/supervisor/test/implementation-loop.test.mjs apps/supervisor/test/numeric-range-checkpoint.test.mjs apps/supervisor/test/productive-context.test.mjs apps/supervisor/test/spend-codex-cli.test.mjs
      - run: npm run check:producer-governance
      - run: node scripts/check-capability-sources.mjs
      - run: node apps/cloud-control/scripts/cloud-source-identity.mjs
      - run: npm run typecheck:producer
      - run: npm run typecheck
      - run: npm run build
