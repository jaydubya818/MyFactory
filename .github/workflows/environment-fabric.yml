name: Environment Fabric
on:
  push:
    branches: [main, codex/environment-fabric]
  pull_request:
permissions:
  contents: read
jobs:
  deterministic:
    name: Factory contracts and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: jaydubya818/MyEveBot
          ref: c0297956eb601cf332ee37c6391e391f4fa5cb89
          path: .qualification/myeve
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix .qualification/myeve --ignore-scripts --no-audit --no-fund
      # Existing local verification deliberately uses --pull=never at execution.
      # Provision its current image before tests; this is not the cloud runtime.
      - run: docker pull node:22-bookworm
      # EvidenceProvider static-preview tests require the locked Playwright browser.
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm test
        env:
          MYEVE_CHECKOUT: ${{ github.workspace }}/.qualification/myeve
      - name: Exact successor authority and ambiguity fencing
        env:
          FACTORY_PAID_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
          FACTORY_POSTGRES_TEST: '1'
          DATABASE_URL_UNPOOLED: postgres://postgres@127.0.0.1:5432/postgres
        run: node --test apps/cloud-control/test/successor-intake-postgres.test.mjs apps/cloud-control/test/cloud-startup-postgres.test.mjs apps/cloud-control/test/paid-ambiguity-postgres.test.mjs apps/cloud-control/test/alpha-owner-postgres.test.mjs apps/cloud-control/test/external-alpha-authority-postgres.test.mjs apps/cloud-control/test/external-alpha-myeve-conformance-postgres.test.mjs apps/cloud-control/test/external-alpha-delivery-postgres.test.mjs
      - run: npm run check:producer-governance
      - run: npm run typecheck:producer
      - run: npm run typecheck
      - run: npm run build
