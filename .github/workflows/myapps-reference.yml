name: MyApps Factory reference
on:
  push:
    branches: [main, codex/myapps-foundation, codex/myapps-phase2, codex/myapps-phase3-readiness, codex/myapps-phase3b-reconciliation, codex/myapps-allowance-successor-20261010]
    paths: ['packages/app-builder/src/myapps/**', 'packages/app-builder/test/myapps*.test.mjs', 'packages/app-builder/scripts/qualify-myapps-identity.mjs', '.github/workflows/myapps-reference.yml']
  pull_request:
    paths: ['packages/app-builder/src/myapps/**', 'packages/app-builder/test/myapps*.test.mjs', 'packages/app-builder/scripts/qualify-myapps-identity.mjs', '.github/workflows/myapps-reference.yml']
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: jaydubya818/MyEveBot
          ref: 92af63f10195ba1ab41560b9cbcd9b4210147556
          path: .qualification/myeve
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test packages/app-builder/test/*.test.mjs apps/cloud-control/test/cloud-verification.test.mjs
        env:
          MYEVE_SOURCE_ROOT: ${{ github.workspace }}/.qualification/myeve
