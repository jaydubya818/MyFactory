name: Capability backend qualification
on:
  push:
    branches: [codex/unified-capability-control-plane]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-producer-governance.mjs
      - run: node scripts/check-capability-sources.mjs
      - run: npm test --workspace=@mission-control/capability-control
      - run: npm run typecheck:producer
      - run: node --test apps/supervisor/test/jobs.test.mjs apps/supervisor/test/capability-admission.test.mjs
      - run: node --test apps/cloud-control/test/alpha-owner-roster.test.mjs apps/cloud-control/test/cloud-contract.test.mjs apps/cloud-control/test/cloud-evidence.test.mjs apps/cloud-control/test/cloud-snapshot.test.mjs apps/cloud-control/test/session-surface-contract.test.mjs
      - run: CAPABILITY_TEST_POSTGRES_BIN="$(pg_config --bindir)" node scripts/qualify-capability-enforcement.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capability-backend-evidence
          path: docs/capability-control/evidence
