name: Local V4 original admission source contracts

on:
  push:
    branches: [codex/sofie-multi-agent-integration-20261025]

permissions:
  contents: read

jobs:
  retained-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.1
      - name: Verify exact reviewed checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-producer-governance.mjs
      - run: npm run typecheck:producer
      - name: Exact candidate identity and historical-grant denials
        run: |
          node apps/cloud-control/scripts/cloud-source-identity.mjs
          node --test apps/cloud-control/test/source-identity-qualification.test.mjs apps/cloud-control/test/pricing-qualification.test.mjs
      - name: Portable original-record and existing producer contracts
        run: node --test apps/supervisor/test/local-v4-admission.test.mjs apps/supervisor/test/producer-results.test.mjs apps/supervisor/test/local-v4-service.test.mjs apps/supervisor/test/server.test.mjs apps/supervisor/test/jobs.test.mjs apps/supervisor/test/local-v4-preparation.test.mjs apps/supervisor/test/local-v4-text-tree.test.mjs apps/supervisor/test/local-v4-candidate-policy.test.mjs apps/supervisor/test/connections.test.mjs apps/supervisor/test/local-v4-context-policy.test.mjs apps/supervisor/test/request-authority.test.mjs apps/supervisor/test/local-v4-checkpoint-policy.test.mjs apps/supervisor/test/local-v4-finalization-policy.test.mjs apps/supervisor/test/execution-provider.test.mjs apps/supervisor/test/resource-observation-freshness.test.mjs apps/supervisor/test/local-v4-verification-input-policy.test.mjs apps/supervisor/test/local-v4-source-artifact.test.mjs
      - name: Existing legacy signing and reopened replay
        run: node --test --test-name-pattern='^Legacy direct producer:' apps/supervisor/qualification/local-v4-producer.test.mjs
      - name: Require unchanged tracked source
        run: git diff --exit-code HEAD

  offline-authority-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: authority_fixture
          POSTGRES_PASSWORD: synthetic-fixture-only
          POSTGRES_DB: postgres
        ports: ['127.0.0.1:55479:5432']
        options: >-
          --health-cmd "pg_isready -U authority_fixture -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Public offline authority and delivery fixture contracts
        env:
          FACTORY_POSTGRES_TEST: '1'
          DATABASE_URL_UNPOOLED: postgresql://authority_fixture:synthetic-fixture-only@127.0.0.1:55479/postgres
        run: node --test apps/cloud-control/test/external-alpha-authority-postgres.test.mjs apps/cloud-control/test/external-alpha-delivery-postgres.test.mjs
      - run: git diff --exit-code HEAD
